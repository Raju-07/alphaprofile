{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel='icon' type="image/svg+xml" href="{% static 'static/final-assests/AlphaProfile_Perfect_SVG_Assets/03_alphaprofile-logo-gradient.svg' %}">

</head>
<body>

    {% if user.is_authenticated %}
    <h2>Welcome, {{ user.username }}!</h2>
    <p>You are logged in.</p>

    <a href="{% url 'portfolio:dashboard' %}">Go to Dashboard</a>

    <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% else %}
    <h2>Welcome, guest!</h2>
    <p>You are not logged in.</p>

    <a href="{% url 'accounts:login' %}">Login</a>
    <a href="{% url 'accounts:register' %}">Register</a>
{% endif %}

    <h1 style={color:"#79191900"}> This is landing page </h1>
    <h2>
        Hello,World!
    </h2>


<h3>
    <a href="{% url 'accounts:register' %}">
        create new account
    </a>
</h3>

<h3>
    <a href="{% url 'accounts:login' %}">
        <p title='click on this to login in your account'> login </p>
    </a>
</h3> 

</body>
</html>
